site_name: llm-chat-openai
site_url: https://johanneslatzel.github.io/llm-chat-openai/
repo_url: https://github.com/johanneslatzel/llm-chat-openai
theme:
  name: material
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
nav:
  - Overview: index.md
  - Architecture: architecture.md
  - Service and configuration: service.md
  - API reference: api-reference.md
  - Environment variables: env.md
  - Quick start: quickstart.md
  - Examples:
      - Overview: examples/index.md
      - Structured output: examples/structured-output.md
      - Usage and cost: examples/usage-and-cost.md
      - Reasoning streams: examples/reasoning.md
      - Local endpoints: examples/local-endpoints.md
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
plugins:
  - search
